{% extends "base.html" %}
{% block title %}Dashboard - PulseAI{% endblock %}

{% block content %}
<script src="https://cdn.tailwindcss.com"></script>

<div class="min-h-screen flex items-start justify-center p-6"
     style="background: linear-gradient(160deg,#f0fdf4 0%,#f0f9ff 50%,#f7f7f7 100%);">

    <div class="w-full max-w-3xl bg-white rounded-2xl p-8 shadow-xl border border-gray-100">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold bg-gradient-to-r from-emerald-500 to-cyan-500 bg-clip-text text-transparent">
                PulseAI
            </h1>
            <p class="text-gray-500 mt-2">
                Welcome {{ profile.full_name }} — AI Powered Health Recommendations
            </p>

            <!-- Language -->
            <div class="flex justify-center gap-3 mt-4">
                <button class="lang-btn active" data-lang="English">English</button>
                <button class="lang-btn" data-lang="Hindi">हिन्दी</button>
                <button class="lang-btn" data-lang="Gujarati">ગુજરાતી</button>
            </div>
        </div>

        <!-- Input -->
        <div class="flex gap-3 mb-6">
            <input type="text"
                   id="conditionInput"
                   placeholder="Enter a condition — e.g. Diabetes, Flu..."
                   class="flex-1 p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-400">

            <button id="getRecommendationBtn"
                    class="px-6 py-4 rounded-xl text-white font-semibold bg-gradient-to-r from-emerald-500 to-cyan-500 hover:shadow-lg transition">
                Get Plan
            </button>
        </div>

        <!-- Chat Area -->
        <div class="border-t pt-6">
            <div class="flex items-center gap-2 mb-3">
                <div class="w-1.5 h-5 rounded-full bg-gradient-to-b from-emerald-500 to-cyan-500"></div>
                <h2 class="font-bold text-gray-700">Conversation</h2>
            </div>

            <!-- Loading -->
            <div id="loadingSpinner" class="hidden text-center py-6 text-gray-400">
                Generating your personalized plan...
            </div>

            <!-- Messages -->
            <div id="chatMessages" class="space-y-4 max-h-[60vh] overflow-y-auto"></div>
        </div>

    </div>
</div>

<style>
.lang-btn{
    padding:6px 16px;
    border:1px solid #e5e7eb;
    border-radius:20px;
    font-weight:600;
    color:#6b7280;
}
.lang-btn.active{
    background:linear-gradient(135deg,#10b981,#06b6d4);
    color:white;
    border:none;
}
.user-msg{
    align-self:flex-end;
    background:linear-gradient(135deg,#10b981,#06b6d4);
    color:white;
    padding:10px 16px;
    border-radius:16px 16px 4px 16px;
    max-width:80%;
}
.bot-msg{
    background:#f9fafb;
    border:1px solid #f3f4f6;
    padding:16px;
    border-radius:4px 16px 16px 16px;
}
</style>

{% endblock %}

{% block extra_js %}
<script>
let selectedLanguage = "English";

document.querySelectorAll(".lang-btn").forEach(btn=>{
    btn.addEventListener("click",function(){
        document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));
        this.classList.add("active");
        selectedLanguage = this.dataset.lang;
    });
});

function addUserMessage(text){
    const div = document.createElement("div");
    div.className="flex justify-end";
    div.innerHTML = `<div class="user-msg">${text}</div>`;
    document.getElementById("chatMessages").appendChild(div);
}

function addBotMessage(text){
    const div = document.createElement("div");
    div.className="flex justify-start";
    div.innerHTML = `<div class="bot-msg">${text.replace(/\n/g,"<br>")}</div>`;
    document.getElementById("chatMessages").appendChild(div);
}

document.getElementById("getRecommendationBtn").addEventListener("click",function(){

    const condition = document.getElementById("conditionInput").value.trim();
    if(!condition){
        alert("Please enter a condition");
        return;
    }

    addUserMessage(condition);
    document.getElementById("conditionInput").value="";
    document.getElementById("loadingSpinner").classList.remove("hidden");

    ffetch('{{ url_for("stream_recommendation") }}',{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            disease: condition,
            language: selectedLanguage
        })
    })
    .then(res=>res.json())
    .then(data=>{
        document.getElementById("loadingSpinner").classList.add("hidden");

        if(data.error){
            addBotMessage("Error: "+data.error);
            return;
        }

        addBotMessage(data.recommendation);
    })
    .catch(err=>{
        document.getElementById("loadingSpinner").classList.add("hidden");
        addBotMessage("Something went wrong.");
    });
});
</script>
{% endblock %}
